<div data-cdn-widget="tabela_dados">
  <div class="td-app">
    <aside class="td-sidebar" aria-label="Navegação">
      <div class="td-sideInner">
        <div class="td-brand" aria-label="Aceleraí">
          <div class="td-brandLogo">
            <img
              class="td-brandImg"
              src="https://awqtzoefutnfmnbomujt.supabase.co/storage/v1/object/public/materiais/Acelerai_preto_magenta.png"
              alt="Aceleraí"
              loading="lazy"
              decoding="async"
              referrerpolicy="no-referrer"
            />
          </div>
        </div>
        <nav class="td-nav">
          <a class="td-navItem td-navItem--active" href="javascript:void(0)" data-role="nav-leads">
            <span class="td-navIcon" aria-hidden="true">👤+</span>
            <span class="td-navLabel">Leads</span>
          </a>
          <a class="td-navItem" href="javascript:void(0)" data-role="nav-opps">
            <span class="td-navIcon" aria-hidden="true">💡</span>
            <span class="td-navLabel">Oportunidades</span>
          </a>
          <a class="td-navItem" href="javascript:void(0)" data-role="nav-meetings">
            <span class="td-navIcon" aria-hidden="true">👥</span>
            <span class="td-navLabel">Reuniões</span>
          </a>
        </nav>
      </div>
    </aside>

    <main class="td-main">
      <div class="td-mainCard">
        <header class="td-topbar">
          <div class="td-titleRow">
            <h1 class="td-title" data-role="title">Leads</h1>

            <div class="td-headerRight">
              <div class="td-search">
                <span class="td-searchIcon" aria-hidden="true">🔎</span>
                <input class="td-searchInput" type="search" placeholder="Pesquisar..." data-role="search" />
              </div>

              <div class="td-actions">
                <button class="td-iconBtn" type="button" data-role="help" aria-label="Ajuda">
                  <span class="td-icon" aria-hidden="true">?</span>
                </button>
                <button class="td-iconBtn" type="button" data-role="settings" aria-label="Configurações">
                  <span class="td-icon" aria-hidden="true">⚙</span>
                </button>
                <div class="td-avatar" aria-hidden="true"></div>
              </div>
            </div>
          </div>

          <div class="td-controls">
            <div class="td-filters">
              <div class="td-dateFilters" role="group" aria-label="Filtros de data">
                <label class="td-dateField">
                  <span class="td-dateLabel">De</span>
                  <input class="td-dateInput" type="date" data-role="date-from" />
                </label>
                <label class="td-dateField">
                  <span class="td-dateLabel">Até</span>
                  <input class="td-dateInput" type="date" data-role="date-to" />
                </label>
                <button class="td-pill td-pill--ghost" type="button" data-role="date-clear">Limpar</button>
              </div>
              <div class="td-spacer"></div>

              <button class="td-export" type="button" data-role="export">
                <span class="td-pillIcon" aria-hidden="true">⬇</span>
                <span>Exportar</span>
              </button>
            </div>
          </div>
        </header>

        <section class="td-card">
          <div class="td-tableWrap" role="region" aria-label="Tabela de dados">
            <table class="td-table">
              <thead>
                <tr>
                  <th class="td-colCheck" scope="col">
                    <input class="td-check" type="checkbox" data-role="check-all" aria-label="Selecionar todos" />
                  </th>
                  <th class="td-colId" scope="col">Id</th>
                  <th scope="col">Data</th>
                  <th scope="col">Nome do Cliente</th>
                  <th scope="col">Segmento</th>
                  <th scope="col">E-mail</th>
                  <th scope="col">Telefone</th>
                  <th scope="col">UTM Campaign</th>
                  <th scope="col">UTM Medium</th>
                  <th scope="col">UTM Source</th>
                  <th scope="col">UTM Term</th>
                  <th scope="col">UTM Content</th>
                  <th scope="col">Vendedor</th>
                  <th class="td-colBool" scope="col">Agência</th>
                  <th scope="col">Nome da Agência</th>
                  <th class="td-colMore" scope="col"></th>
                </tr>
              </thead>
              <tbody data-role="tbody">
                <!-- rows injected by JS -->
              </tbody>
            </table>
          </div>

          <footer class="td-footer">
            <div class="td-footerLeft">
              <span class="td-footerLabel">Linhas por página:</span>
              <button class="td-footerSelect" type="button" data-role="page-size" aria-label="Alterar linhas por página">
                <span data-role="page-size-label">10</span>
                <span class="td-caret" aria-hidden="true">▾</span>
              </button>
            </div>

            <div class="td-footerRight">
              <span class="td-footerRange" data-role="range">—</span>
              <div class="td-footerNav">
                <button class="td-navBtn" type="button" data-role="prev" aria-label="Página anterior">‹</button>
                <button class="td-navBtn" type="button" data-role="next" aria-label="Próxima página">›</button>
              </div>
            </div>
          </footer>
        </section>
      </div>
    </main>
  </div>
</div>
