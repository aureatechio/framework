<!DOCTYPE html>

<html lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Métricas de Eficiência Dashboard</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Material Symbols for the bullseye icon -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-typography">
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="p-8">
<!-- BEGIN: MetricsSection -->
<main class="max-w-7xl mx-auto">
<section class="bg-white border border-gray-200 rounded-xl shadow-sm p-6" data-purpose="dashboard-container">
<!-- Section Title -->
<header class="mb-6">
<h2 class="text-gray-800 text-sm font-bold">Métricas de Eficiência</h2>
</header>
<!-- Metrics Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3" data-purpose="metrics-grid">
<!-- Card 1: Ciclo de vida (dias) -->
<article class="bg-slate-50/50 p-4 rounded-md border border-transparent" data-purpose="metric-card">
<div class="flex flex-col">
<span class="text-blue-600 text-3xl font-bold tracking-tight">7.2</span>
<span class="text-gray-500 text-[10px] font-semibold mt-1 uppercase tracking-wider">Ciclo de vida (dias)</span>
</div>
</article>
<!-- Card 2: FRT Pré-venda -->
<article class="bg-slate-50/50 p-4 rounded-md border border-transparent" data-purpose="metric-card">
<div class="flex flex-col">
<span class="text-amber-500 text-3xl font-bold tracking-tight">12m 30s</span>
<span class="text-gray-500 text-[10px] font-semibold mt-1 uppercase tracking-wider">FRT Pré-venda</span>
</div>
</article>
<!-- Card 3: Pace (Faturamento VS LY) -->
<article class="bg-slate-50/50 p-4 rounded-md border border-transparent" data-purpose="metric-card">
<div class="flex flex-col"><div class="flex flex-col">
<div class="flex items-baseline gap-2">
<span class="text-emerald-600 text-3xl font-bold tracking-tight">R$ 45.2k</span>
<span class="text-emerald-500 text-[10px] font-bold bg-emerald-50 px-1.5 py-0.5 rounded">+ R$ 5.1k vs 2025</span>
</div>
<span class="text-gray-500 text-[10px] font-semibold mt-1 uppercase tracking-wider">Pace (Faturamento VS 2025)</span>
</div></div>
</article>
<!-- Card 4: Projeção (Highlighted Blue Card) -->
<article class="bg-blue-50/80 p-4 rounded-md border border-transparent flex items-center justify-center" data-purpose="metric-card">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-blue-600 text-4xl font-light">track_changes</span>
<div class="flex flex-col">
<span class="text-gray-800 text-[10px] font-bold uppercase tracking-tight">Projeção</span>
<span class="text-blue-600 text-xl font-bold leading-tight">R$ 942.86k</span>
<span class="text-gray-600 text-[10px] font-medium leading-tight">Mês até hoje: R$ 334.56k • Dia 11/31</span>
</div>
</div>
</article>
</div>
</section>
</main>
<!-- END: MetricsSection -->
</body></html>
